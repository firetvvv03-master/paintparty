        class SoundFX {
            constructor() { this.ctx = null; this.muted = false; }
            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    if (AudioContext) this.ctx = new AudioContext();
                }
            }
            playTone(freq, type = 'sine', duration = 0.1, gainVal = 0.1) {
                if (this.muted || !this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type; osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    gain.gain.setValueAtTime(gainVal, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
                    osc.connect(gain); gain.connect(this.ctx.destination);
                    osc.start(); osc.stop(this.ctx.currentTime + duration);
                } catch(e) {}
            }
            pop() { this.playTone(400 + Math.random() * 200, 'sine', 0.08, 0.15); }
            powerup() {
                if (this.muted || !this.ctx) return;
                [440, 554, 659, 880].forEach((f, i) => {
                    setTimeout(() => this.playTone(f, 'triangle', 0.12, 0.2), i * 60);
                });
            }
            winJingle() {
                if (this.muted || !this.ctx) return;
                [523.25, 659.25, 783.99, 1046.50].forEach((f, i) => {
                    setTimeout(() => this.playTone(f, 'sine', 0.25, 0.25), i * 120);
                });
            }
        }

            name: `Board ${i + 1}: ${['Cloud Plain', 'Starry Ring', 'Rainbow Spiral', 'Heart Haven', 'Sweet Maze', 'Diamond Isle', 'Bubble Cluster', 'Crescent Moon', 'Sunny Meadow', 'Candy Blocks', 'Pillars of Joy', 'Pixel Flower', 'Castle Walls', 'Starlight Cross', 'Gingham Pastel', 'Zigzag Zephyr', 'Dot Matrix', 'Magic Portal', 'Open Skies', 'Ultimate Arena'][i]}`,
            themeColor: ['#fbcfe8', '#bfdbfe', '#fde68a', '#fecdd3', '#e9d5ff', '#99f6e4', '#fed7aa', '#c7d2fe', '#bbf7d0', '#fbcfe8', '#fed7aa', '#e9d5ff', '#bfdbfe', '#fde68a', '#99f6e4', '#fecdd3', '#c7d2fe', '#bbf7d0', '#fbcfe8', '#e0e7ff'][i]
        }));

        const customPlayer = {
            charIndex: 0, category: 'animal', colorIndex: 0,
            charType: SKIN_CATEGORIES.animal[0], colorSwatch: COLOR_SWATCHES[0]
        };

        const customBoss = {
            charIndex: 19, category: 'animal', colorIndex: 1,
            charType: SKIN_CATEGORIES.animal[19], colorSwatch: COLOR_SWATCHES[1]
        };

        let selectedBoardIndex = 0;

        const player = {
            x: 2, y: 2, px: 0, py: 0, dx: 0, dy: 0, speed: 4.5,
            trailColor: 'rgba(0, 229, 255, 0.85)', glowColor: '#00E5FF',
            name: 'Blinky', facing: 'right', powerup: null, powerupTimer: 0,
            isFrozen: false, isSlowed: false, isGhost: false,
            charType: SKIN_CATEGORIES.animal[0], colorSwatch: COLOR_SWATCHES[0], isBoss: false
        };

        const opponent = {
            x: GRID_COLS - 3, y: GRID_ROWS - 3, px: 0, py: 0, dx: 0, dy: 0, speed: 4.1,
            trailColor: 'rgba(255, 64, 129, 0.85)', glowColor: '#FF4081',
            name: 'Boss Dragon', facing: 'left', powerup: null, powerupTimer: 0, changeDirTimer: 0,
            isFrozen: false, isSlowed: false, isGhost: false,
            charType: SKIN_CATEGORIES.animal[19], colorSwatch: COLOR_SWATCHES[1], isBoss: true
        };

        const keys = { up: false, down: false, left: false, right: false };

        function setGameMode(mode) {
            gameMode = mode;
            document.getElementById('mode-boss').className = `p-3 rounded-2xl border-2 font-fredoka text-sm shadow-md ${mode === 'boss' ? 'border-purple-500 bg-purple-100 text-purple-700' : 'border-white bg-white/60 text-purple-800'}`;
            document.getElementById('mode-network').className = `p-3 rounded-2xl border-2 font-fredoka text-sm shadow-md ${mode === 'network' ? 'border-purple-500 bg-purple-100 text-purple-700' : 'border-white bg-white/60 text-purple-800'}`;
            
            const netPanel = document.getElementById('network-panel');
            if (mode === 'network') netPanel.classList.remove('hidden');
            else netPanel.classList.add('hidden');
        }

        function setCustomizingRole(role) {
            customizingRole = role;
            const pBtn = document.getElementById('role-player');
            const bBtn = document.getElementById('role-boss');
            if (role === 'player') {
                pBtn.className = "py-2 rounded-xl border-2 font-fredoka text-xs bg-cyan-100 border-cyan-400 text-cyan-700 shadow";
                bBtn.className = "py-2 rounded-xl border-2 font-fredoka text-xs bg-white/60 border-white text-pink-700 shadow";
                setCategory(customPlayer.category, false);
            } else {
                bBtn.className = "py-2 rounded-xl border-2 font-fredoka text-xs bg-pink-100 border-pink-400 text-pink-700 shadow";
                pBtn.className = "py-2 rounded-xl border-2 font-fredoka text-xs bg-white/60 border-white text-cyan-700 shadow";
                setCategory(customBoss.category, false);
            }
            populateMenus();
        }

        function setCategory(cat, updateRoleState = true) {
            if (updateRoleState) {
                if (customizingRole === 'player') customPlayer.category = cat;
                else customBoss.category = cat;
            }
            ['animal', 'holiday', 'transport', 'fruit'].forEach(c => {
                const btn = document.getElementById(`cat-${c}`);
                if (c === cat) {
                    btn.className = "py-1.5 px-2 rounded-xl border-2 font-fredoka text-xs bg-purple-100 border-purple-400 text-purple-700";
                } else {
                    btn.className = "py-1.5 px-2 rounded-xl border-2 font-fredoka text-xs bg-white/60 border-white text-purple-700";
                }
            });
            if (updateRoleState) {
                if (customizingRole === 'player') customPlayer.charIndex = 0;
                else customBoss.charIndex = 0;
            }
            populateMenus();
        }

        function populateMenus() {
            const activeCustom = customizingRole === 'player' ? customPlayer : customBoss;
            const charContainer = document.getElementById('character-selector');
            charContainer.innerHTML = '';
            
            SKIN_CATEGORIES[activeCustom.category].forEach((char, idx) => {
                const btn = document.createElement('button');
                btn.className = `p-2 rounded-2xl flex flex-col items-center justify-center border-2 transition-all ${idx === activeCustom.charIndex ? (customizingRole === 'player' ? 'border-cyan-500 bg-cyan-100 shadow-md scale-105' : 'border-pink-500 bg-pink-100 shadow-md scale-105') : 'border-white bg-white/60 hover:bg-white'}`;
                btn.innerHTML = `<span class="text-2xl">${char.icon}</span><span class="text-[10px] font-bold text-purple-900 mt-0.5 truncate w-full text-center">${char.name}</span>`;
                btn.onclick = () => {
                    activeCustom.charIndex = idx;
                    activeCustom.charType = char;
                    populateMenus();
                };
                charContainer.appendChild(btn);
            });

            const colorContainer = document.getElementById('color-selector');
            colorContainer.innerHTML = '';
            COLOR_SWATCHES.forEach((swatch, idx) => {
                const btn = document.createElement('button');
                btn.className = `w-7 h-7 rounded-full border-2 transition-transform ${idx === activeCustom.colorIndex ? 'border-purple-800 scale-125 shadow-lg' : 'border-white hover:scale-110'}`;
                btn.style.backgroundColor = swatch.hex;
                btn.title = swatch.name;
                btn.onclick = () => {
                    activeCustom.colorIndex = idx;
                    activeCustom.colorSwatch = swatch;
                    populateMenus();
                };
                colorContainer.appendChild(btn);
            });

            const boardContainer = document.getElementById('board-selector');
            boardContainer.innerHTML = '';
            BOARD_LAYOUTS.forEach((board, idx) => {
                const btn = document.createElement('button');
                btn.className = `p-2 rounded-2xl text-xs font-bold transition-all border-2 text-center truncate ${idx === selectedBoardIndex ? 'border-purple-500 bg-purple-100 text-purple-700 shadow-md scale-105' : 'border-white bg-white/60 text-purple-800 hover:bg-white'}`;
                btn.style.backgroundColor = board.themeColor;
                btn.textContent = board.name.split(':')[0];
                btn.title = board.name;
                btn.onclick = () => { selectedBoardIndex = idx; populateMenus(); };
                boardContainer.appendChild(btn);
            });
        }

        function resizeCanvas() {
            const container = canvas.parentElement;
            const maxWidth = container.clientWidth - 16;
            const maxHeight = container.clientHeight - 16;
            
            let w = maxWidth;
            let h = w * (GRID_ROWS / GRID_COLS);
            if (h > maxHeight) {
                h = maxHeight;
                w = h * (GRID_COLS / GRID_ROWS);
            }

            canvas.width = w; canvas.height = h;
            cellWidth = w / GRID_COLS;
            cellHeight = h / GRID_ROWS;
            
            player.px = player.x * cellWidth + cellWidth / 2; player.py = player.y * cellHeight + cellHeight / 2;
            opponent.px = opponent.x * cellWidth + cellWidth / 2; opponent.py = opponent.y * cellHeight + cellHeight / 2;
        }

        function generateBoardLayout(boardId) {
            wallGrid = Array(GRID_ROWS).fill(0).map(() => Array(GRID_COLS).fill(0));
            const b = boardId % 20;
            if (b === 1) {
                for (let r = 6; r < 18; r++) { wallGrid[r][10] = 1; wallGrid[r][25] = 1; }
                for (let c = 10; c < 26; c++) { wallGrid[6][c] = 1; wallGrid[17][c] = 1; }
            } else if (b === 2) {
                for (let i = 3; i < 21; i++) { wallGrid[i][i] = 1; wallGrid[i][GRID_COLS - 1 - i] = 1; }
            } else if (b > 2) {
                for (let r = 2; r < GRID_ROWS - 2; r++) {
                    for (let c = 2; c < GRID_COLS - 2; c++) {
                        if ((r * c + b) % 11 === 0 && !(r < 5 && c < 5) && !(r > GRID_ROWS - 6 && c > GRID_COLS - 6)) {
                            wallGrid[r][c] = 1;
                        }
                    }
                }
            }
        }

        function initGrid() {
            grid = Array(GRID_ROWS).fill(0).map(() => Array(GRID_COLS).fill(0));
            generateBoardLayout(selectedBoardIndex);
            
            player.x = 2; player.y = 2;
            opponent.x = GRID_COLS - 3; opponent.y = GRID_ROWS - 3;

            paintArea(Math.floor(player.x), Math.floor(player.y), 1, 1);
            paintArea(Math.floor(opponent.x), Math.floor(opponent.y), 2, 1);
        }

        const POWERUP_TYPES = [
            { type: 'burst', icon: '⚡', name: 'Rainbow Burst!', color: '#fbbf24' },
            { type: 'speed', icon: '💨', name: 'Speedy Hooves!', color: '#38bdf8' },
            { type: 'shield', icon: '🛡️', name: 'Glitter Shield!', color: '#c084fc' },
            { type: 'freeze', icon: '❄️', name: 'Frost Wave (Freeze 6s)!', color: '#93c5fd' },
            { type: 'splatter', icon: '💥', name: 'Paint Splatter (5x5)!', color: '#fb923c' },
            { type: 'ghost', icon: '👻', name: 'Ghost Phase-Through (4s)!', color: '#e879f9' },
            { type: 'swap', icon: '🔀', name: 'Color Swap (Reverser)!', color: '#4ade80' },
            { type: 'multiplier', icon: '🪙', name: 'Score Multiplier (2x)!', color: '#facc15' },
            { type: 'mega', icon: '🌟', name: 'Mega Brush!', color: '#facc15' },
            { type: 'teleport', icon: '🌀', name: 'Cloud Blink!', color: '#f472b6' }
        ];

        function spawnPowerup() {
            if (!isGameRunning || powerups.length >= 7) return;
            const rx = Math.floor(Math.random() * (GRID_COLS - 2)) + 1;
            const ry = Math.floor(Math.random() * (GRID_ROWS - 2)) + 1;
            if (wallGrid[ry][rx] === 1) return;

            const pType = POWERUP_TYPES[Math.floor(Math.random() * POWERUP_TYPES.length)];
            powerups.push({
                x: rx, y: ry, px: rx * cellWidth + cellWidth / 2, py: ry * cellHeight + cellHeight / 2,
                type: pType.type, icon: pType.icon, name: pType.name, color: pType.color, bounce: 0
            });
        }

        function applyPowerup(entity, pu) {
            sfx.powerup();
            createBurstParticles(pu.px, pu.py, pu.color, 25);

            const ownerId = entity === player ? 1 : 2;
            const target = entity === player ? opponent : player;

            if (pu.type === 'burst') {
                paintArea(Math.round(entity.x), Math.round(entity.y), ownerId, 2);
            } else if (pu.type === 'splatter') {
                paintArea(Math.round(entity.x), Math.round(entity.y), ownerId, 3);
            } else if (pu.type === 'ghost') {
                entity.isGhost = true;
                setTimeout(() => entity.isGhost = false, 4000);
            } else if (pu.type === 'swap') {
                // Flip random opponent tiles to user's color
                const opponentId = ownerId === 1 ? 2 : 1;
                for (let r = 0; r < GRID_ROWS; r++) {
                    for (let c = 0; c < GRID_COLS; c++) {
                        if (grid[r][c] === opponentId && Math.random() < 0.35) {
                            grid[r][c] = ownerId;
                        }
                    }
                }
            } else if (pu.type === 'freeze') {
                if (target.powerup === 'shield') target.powerup = null;
                else { target.isFrozen = true; setTimeout(() => target.isFrozen = false, 6000); }
            } else if (pu.type === 'teleport') {
                entity.x = Math.floor(Math.random() * (GRID_COLS - 4)) + 2;
                entity.y = Math.floor(Math.random() * (GRID_ROWS - 4)) + 2;
                entity.px = entity.x * cellWidth + cellWidth / 2;
                entity.py = entity.y * cellHeight + cellHeight / 2;
            } else {
                entity.powerup = pu.type; entity.powerupTimer = 300;
            }

            if (entity === player) {
                const badge = document.getElementById('powerup-badge');
                badge.textContent = `${pu.icon} ${pu.name}`;
                badge.classList.remove('hidden');
                setTimeout(() => badge.classList.add('hidden'), 2500);
            }
        }

        function paintArea(cx, cy, ownerId, radius) {
            for (let r = -radius; r <= radius; r++) {
                for (let c = -radius; c <= radius; c++) {
                    const ny = cy + r, nx = cx + c;
                    if (ny >= 0 && ny < GRID_ROWS && nx >= 0 && nx < GRID_COLS) {
                        if (wallGrid[ny][nx] !== 1) grid[ny][nx] = ownerId;
                    }
                }
            }
        }

        function createBurstParticles(x, y, color, count = 15) {
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 4 + 1;
                particles.push({
                    x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
                    size: Math.random() * 6 + 3, color, alpha: 1, life: Math.random() * 20 + 20
                });
            }
        }

        function updateParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx; p.y += p.vy; p.alpha -= 1 / p.life; p.size *= 0.95;
                if (p.alpha <= 0) particles.splice(i, 1);
            }
        }

        function updateBossAI() {
            if (opponent.isFrozen) return;
            opponent.changeDirTimer--;

            const currentGridX = Math.round(opponent.x);
            const currentGridY = Math.round(opponent.y);

            const nextX = currentGridX + opponent.dx;
            const nextY = currentGridY + opponent.dy;
            const isBlocked = nextX < 0 || nextX >= GRID_COLS || nextY < 0 || nextY >= GRID_ROWS || (wallGrid[nextY][nextX] === 1 && !opponent.isGhost);

            if (opponent.changeDirTimer <= 0 || isBlocked || (opponent.dx === 0 && opponent.dy === 0)) {
                opponent.changeDirTimer = Math.floor(Math.random() * 12) + 8;
                let targetX = opponent.x, targetY = opponent.y;

                if (powerups.length > 0) {
                    let nearestPu = powerups[0];
                    let minDist = 999;
                    powerups.forEach(p => {
                        const dist = Math.hypot(p.x - opponent.x, p.y - opponent.y);
                        if (dist < minDist) { minDist = dist; nearestPu = p; }
                    });
                    targetX = nearestPu.x; targetY = nearestPu.y;
                } else {
                    let bestDist = 999;
                    let foundTarget = false;
                    for (let r = 2; r < GRID_ROWS - 2; r += 2) {
                        for (let c = 2; c < GRID_COLS - 2; c += 2) {
                            if (grid[r][c] !== 2 && wallGrid[r][c] !== 1) {
                                const dist = Math.hypot(c - opponent.x, r - opponent.y);
                                if (dist < bestDist && dist > 2) {
                                    bestDist = dist; targetX = c; targetY = r; foundTarget = true;
                                }
                            }
                        }
                    }
                    if (!foundTarget) {
                        targetX = Math.floor(Math.random() * (GRID_COLS - 4)) + 2;
                        targetY = Math.floor(Math.random() * (GRID_ROWS - 4)) + 2;
                    }
                }

                const dx = targetX - opponent.x;
                const dy = targetY - opponent.y;
                if (Math.abs(dx) > Math.abs(dy)) {
                    opponent.dx = dx > 0 ? 1 : -1; opponent.dy = 0; opponent.facing = dx > 0 ? 'right' : 'left';
                } else {
                    opponent.dx = 0; opponent.dy = dy > 0 ? 1 : -1;
                }
            }
            moveEntity(opponent, 2);
        }

        function moveEntity(entity, ownerId) {
            if (entity.isFrozen) return;

            let currentSpeed = 4.5;
            if (entity.isSlowed) currentSpeed *= 0.5;
            if (entity.powerup === 'speed') currentSpeed *= 1.6;

            let nextPx = entity.px + entity.dx * currentSpeed;
            let nextPy = entity.py + entity.dy * currentSpeed;

            const nextGridX = Math.floor(nextPx / cellWidth);
            const nextGridY = Math.floor(nextPy / cellHeight);
            if (nextGridY >= 0 && nextGridY < GRID_ROWS && nextGridX >= 0 && nextGridX < GRID_COLS) {
                if (wallGrid[nextGridY][nextGridX] !== 1 || entity.isGhost) {
                    entity.px = nextPx; entity.py = nextPy;
                }
            }

            entity.px = Math.max(cellWidth / 2, Math.min(canvas.width - cellWidth / 2, entity.px));
            entity.py = Math.max(cellHeight / 2, Math.min(canvas.height - cellHeight / 2, entity.py));

            entity.x = entity.px / cellWidth; entity.y = entity.py / cellHeight;

            const gridX = Math.floor(entity.x); const gridY = Math.floor(entity.y);
            if (gridY >= 0 && gridY < GRID_ROWS && gridX >= 0 && gridX < GRID_COLS) {
                let radius = entity.powerup === 'shield' || entity.powerup === 'mega' ? 1 : 0;
                paintArea(gridX, gridY, ownerId, radius);
            }

            for (let i = powerups.length - 1; i >= 0; i--) {
                const pu = powerups[i];
                if (Math.hypot(entity.px - pu.px, entity.py - pu.py) < Math.max(cellWidth, cellHeight)) {
                    applyPowerup(entity, pu);
                    powerups.splice(i, 1);
                }
            }

            if (entity.powerupTimer > 0) {
                entity.powerupTimer--;
                if (entity.powerupTimer <= 0) entity.powerup = null;
            }
        }

        function updatePlayer() {
            if (player.isFrozen) return;
            player.dx = 0; player.dy = 0;
            if (keys.up) player.dy = -1;
            if (keys.down) player.dy = 1;
            if (keys.left) { player.dx = -1; player.facing = 'left'; }
            if (keys.right) { player.dx = 1; player.facing = 'right'; }

            if (player.dx !== 0 && player.dy !== 0) { player.dx *= 0.7071; player.dy *= 0.7071; }

            if (player.dx !== 0 || player.dy !== 0) {
                moveEntity(player, 1);
                if (conn && conn.open) {
                    conn.send({ type: 'move', x: player.x, y: player.y, dx: player.dx, dy: player.dy, grid: grid });
                }
            }
        }

        function drawGrid() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let r = 0; r < GRID_ROWS; r++) {
                for (let c = 0; c < GRID_COLS; c++) {
                    const x = c * cellWidth, y = r * cellHeight, cellState = grid[r][c];
                    ctx.save();
                    
                    if (wallGrid[r][c] === 1) {
                        ctx.fillStyle = '#fee2e2';
                        ctx.beginPath(); ctx.roundRect(x + 1, y + 1, cellWidth - 2, cellHeight - 2, 4);
                        ctx.fill();
                        ctx.strokeStyle = '#f87171'; ctx.lineWidth = 1.5; ctx.stroke();
                        
                        ctx.strokeStyle = '#dc2626'; ctx.lineWidth = 2;
                        ctx.beginPath();
                        ctx.moveTo(x + cellWidth * 0.25, y + cellHeight * 0.25);
                        ctx.lineTo(x + cellWidth * 0.75, y + cellHeight * 0.75);
                        ctx.moveTo(x + cellWidth * 0.75, y + cellHeight * 0.25);
                        ctx.lineTo(x + cellWidth * 0.25, y + cellHeight * 0.75);
                        ctx.stroke();
                    } else {
                        if (cellState === 1) ctx.fillStyle = player.trailColor;
                        else if (cellState === 2) ctx.fillStyle = opponent.trailColor;
                        else ctx.fillStyle = (r + c) % 2 === 0 ? '#ffffff' : '#f8fafc';

                        ctx.beginPath(); ctx.roundRect(x + 1, y + 1, cellWidth - 2, cellHeight - 2, 4);
                        ctx.fill(); ctx.strokeStyle = 'rgba(226, 232, 240, 0.4)'; ctx.lineWidth = 1; ctx.stroke();
                    }
                    ctx.restore();
                }
            }
        }

        function drawPowerups() {
            powerups.forEach(pu => {
                pu.bounce += 0.08; const offsetY = Math.sin(pu.bounce) * 4;
                ctx.save(); ctx.shadowColor = pu.color; ctx.shadowBlur = 10;
                ctx.fillStyle = 'rgba(255, 255, 255, 0.95)';
                
                ctx.beginPath(); ctx.arc(pu.px, pu.py + offsetY, cellWidth * 0.65, 0, Math.PI * 2);
                ctx.fill(); ctx.strokeStyle = pu.color; ctx.lineWidth = 2.5; ctx.stroke();

                ctx.font = `${cellWidth * 0.75}px sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText(pu.icon, pu.px, pu.py + offsetY);

                ctx.font = `bold ${Math.max(10, cellWidth * 0.32)}px 'Quicksand', sans-serif`;
                ctx.fillStyle = '#6b21a8';
                ctx.textAlign = 'center';
                ctx.fillText(pu.name, pu.px, pu.py + offsetY + cellHeight * 0.85);
                
                ctx.restore();
            });
        }

        function drawCharacter(entity) {
            ctx.save(); ctx.translate(entity.px, entity.py);
            const swatch = entity.colorSwatch;
            const size = Math.min(cellWidth, cellHeight) * 1.8;

            ctx.globalAlpha = entity.isGhost ? 0.5 : 1.0;
            ctx.shadowColor = entity.isFrozen ? '#38bdf8' : swatch.hex; 
            ctx.shadowBlur = entity.isFrozen ? 30 : 22; 
            ctx.fillStyle = entity.isFrozen ? '#bae6fd' : swatch.hex;

            ctx.beginPath(); ctx.arc(0, 0, size * 0.46, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2.5; ctx.stroke();

            ctx.font = `${size * 0.55}px sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(entity.charType.icon, 0, 2);

            if (entity.isGhost) {
                ctx.font = '20px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('👻', 0, -size * 0.8);
            }
            if (entity.isFrozen) {
                ctx.font = '24px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('❄️', 0, -size * 0.8);
            }

            ctx.restore();
        }

        function drawParticles() {
            particles.forEach(p => {
                ctx.save(); ctx.globalAlpha = p.alpha; ctx.fillStyle = p.color;
                ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
                ctx.restore();
            });
        }

        function updateScores() {
            let playerPainted = 0, opponentPainted = 0, totalOpenCells = 0;
            for (let r = 0; r < GRID_ROWS; r++) {
                for (let c = 0; c < GRID_COLS; c++) {
                    if (wallGrid[r][c] !== 1) {
                        totalOpenCells++;
                        if (grid[r][c] === 1) playerPainted++;
                        if (grid[r][c] === 2) opponentPainted++;
                    }
                }
            }

            if (player.powerup === 'multiplier') playerPainted = Math.min(totalOpenCells, Math.round(playerPainted * 1.35));

            const playerPct = Math.round((playerPainted / totalOpenCells) * 100) || 0;
            const opponentPct = Math.round((opponentPainted / totalOpenCells) * 100) || 0;

            document.getElementById('player-score').textContent = `${playerPct}%`;
            document.getElementById('ai-score').textContent = `${opponentPct}%`;
            document.getElementById('progress-player').style.width = `${playerPct}%`;
            document.getElementById('progress-ai').style.width = `${opponentPct}%`;

            return { playerPct, opponentPct };
        }

        function gameLoop() {
            if (isGameRunning) {
                updatePlayer();
                if (gameMode === 'boss') updateBossAI();
                updateParticles();
                updateScores();
                if (Math.random() < 0.008) spawnPowerup();
            }

            drawGrid();
            drawPowerups();
            drawCharacter(player);
            drawCharacter(opponent);
            drawParticles();

            requestAnimationFrame(gameLoop);
        }

        function startGame() {
            sfx.init();

            player.charType = customPlayer.charType;
            player.colorSwatch = customPlayer.colorSwatch;
            player.trailColor = customPlayer.colorSwatch.hex + 'CC';
            player.glowColor = customPlayer.colorSwatch.hex;

            opponent.charType = customBoss.charType;
            opponent.colorSwatch = customBoss.colorSwatch;
            opponent.trailColor = customBoss.colorSwatch.hex + 'CC';
            opponent.glowColor = customBoss.colorSwatch.hex;

            initGrid();
            gameTimeLeft = 120;
            isGameRunning = true;
            powerups = [];
            particles = [];

            player.isFrozen = false; player.isSlowed = false; player.isGhost = false;
            opponent.isFrozen = false; opponent.isSlowed = false; opponent.isGhost = false;

            if (gameMode === 'boss') {
                opponent.name = `👑 ${opponent.charType.name}`;
                opponent.speed = 4.5;
                opponent.isBoss = true;
            } else {
                opponent.name = 'Friend (WiFi)';
                opponent.speed = 4.2;
                opponent.isBoss = false;
            }

            resizeCanvas();

            document.getElementById('modal-overlay').classList.add('hidden');
            document.getElementById('start-card').classList.add('hidden');
            document.getElementById('result-card').classList.add('hidden');
            document.getElementById('game-timer').textContent = gameTimeLeft;

            document.getElementById('hud-player-avatar').style.background = player.colorSwatch.hex;
            document.getElementById('hud-player-avatar').textContent = player.charType.icon;
            document.getElementById('hud-player-name').textContent = player.charType.name;

            document.getElementById('hud-opponent-avatar').style.background = opponent.colorSwatch.hex;
            document.getElementById('hud-opponent-avatar').textContent = opponent.charType.icon;
            document.getElementById('hud-opponent-name').textContent = opponent.name;

            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (!isGameRunning) return;
                gameTimeLeft--;
                document.getElementById('game-timer').textContent = gameTimeLeft;
                if (gameTimeLeft <= 0) endGame();
            }, 1000);
        }

        function endGame() {
            isGameRunning = false;
            clearInterval(timerInterval);

            const scores = updateScores();
            const playerWon = scores.playerPct >= scores.opponentPct;

            if (playerWon) {
                sfx.winJingle();
                document.getElementById('result-emoji').textContent = '🏆';
                document.getElementById('result-title').textContent = `${player.charType.name} Wins!`;
                document.getElementById('result-stars').textContent = '⭐⭐⭐';
                document.getElementById('result-subtitle').textContent = `You painted ${scores.playerPct}% of the board!`;
                createBurstParticles(canvas.width / 2, canvas.height / 2, player.colorSwatch.hex, 50);
            } else {
                document.getElementById('result-emoji').textContent = '👑';
                document.getElementById('result-title').textContent = `${opponent.name} Wins!`;
                document.getElementById('result-stars').textContent = '⭐';
                document.getElementById('result-subtitle').textContent = `${opponent.name} painted ${scores.opponentPct}%! Try again!`;
            }

            document.getElementById('final-player-score').textContent = `${scores.playerPct}%`;
            document.getElementById('final-ai-score').textContent = `${scores.opponentPct}%`;

            document.getElementById('modal-overlay').classList.remove('hidden');
            document.getElementById('result-card').classList.remove('hidden');
        }

        function openMenu() {
            isGameRunning = false;
            clearInterval(timerInterval);
            populateMenus();
            document.getElementById('result-card').classList.add('hidden');
            document.getElementById('start-card').classList.remove('hidden');
            document.getElementById('modal-overlay').classList.remove('hidden');
        }

        function initPeerJS() {
            peer = new Peer();
            peer.on('open', (id) => {
                document.getElementById('peer-status').textContent = `Your Peer ID: ${id} (Share with friend!)`;
            });
            peer.on('connection', (c) => {
                conn = c; isHost = true;
                setupConnection();
            });
        }

        document.getElementById('btn-host').addEventListener('click', () => { initPeerJS(); });

        document.getElementById('btn-join').addEventListener('click', () => {
            const remoteId = prompt("Enter Host Peer ID:");
            if (!remoteId) return;
            peer = new Peer();
            peer.on('open', () => {
                conn = peer.connect(remoteId);
                isHost = false;
                setupConnection();
            });
        });

        function setupConnection() {
            conn.on('open', () => {
                document.getElementById('peer-status').textContent = "Connected over WiFi! Ready!";
                setTimeout(startGame, 1000);
            });
            conn.on('data', (data) => {
                if (data.type === 'move') {
                    opponent.x = data.x; opponent.y = data.y;
                    opponent.px = data.x * cellWidth + cellWidth / 2;
                    opponent.py = data.y * cellHeight + cellHeight / 2;
                    grid = data.grid;
                }
            });
        }

        function bindInputs() {
            window.addEventListener('keydown', (e) => {
                if (['ArrowUp', 'KeyW'].includes(e.code)) keys.up = true;
                if (['ArrowDown', 'KeyS'].includes(e.code)) keys.down = true;
                if (['ArrowLeft', 'KeyA'].includes(e.code)) keys.left = true;
                if (['ArrowRight', 'KeyD'].includes(e.code)) keys.right = true;
            });

            window.addEventListener('keyup', (e) => {
                if (['ArrowUp', 'KeyW'].includes(e.code)) keys.up = false;
                if (['ArrowDown', 'KeyS'].includes(e.code)) keys.down = false;
                if (['ArrowLeft', 'KeyA'].includes(e.code)) keys.left = false;
                if (['ArrowRight', 'KeyD'].includes(e.code)) keys.right = false;
            });

            const dpadMap = [
                { id: 'btn-up', key: 'up' }, { id: 'btn-down', key: 'down' },
                { id: 'btn-left', key: 'left' }, { id: 'btn-right', key: 'right' }
            ];

            dpadMap.forEach(btn => {
                let el = document.getElementById(btn.id);
                const startPress = (e) => { e.preventDefault(); sfx.init(); sfx.pop(); keys[btn.key] = true; el.classList.add('active'); };
                const endPress = (e) => { e.preventDefault(); keys[btn.key] = false; el.classList.remove('active'); };
                el.addEventListener('mousedown', startPress); el.addEventListener('mouseup', endPress);
                el.addEventListener('mouseleave', endPress); el.addEventListener('touchstart', startPress);
                el.addEventListener('touchend', endPress);
            });

            document.getElementById('btn-start').addEventListener('click', startGame);
            document.getElementById('btn-play-again').addEventListener('click', startGame);
            document.getElementById('btn-menu').addEventListener('click', openMenu);
            document.getElementById('btn-sound').addEventListener('click', () => {
                sfx.muted = !sfx.muted;
                document.getElementById('btn-sound').textContent = sfx.muted ? '🔇 Muted' : '🔊 Audio';
            });

            window.addEventListener('resize', resizeCanvas);
        }
