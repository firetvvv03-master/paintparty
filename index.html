<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, orientation=landscape">
    <title>Glow Bunny Paint Party - Mobile Landscape Optimized</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(135deg, #ffd1dc 0%, #e0c3fc 50%, #8ec5fc 100%);
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            overflow: hidden;
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
        }

        .font-fredoka {
            font-family: 'Fredoka One', cursive;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 2px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 6px 20px rgba(180, 140, 210, 0.25);
        }

        .btn-cute {
            transition: transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.15s ease;
            box-shadow: 0 4px 0 rgba(0,0,0,0.15);
        }

        .btn-cute:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 rgba(0,0,0,0.15);
        }

        .dpad-btn {
            background: rgba(255, 255, 255, 0.9);
            border: 2px solid #f3a8f1;
            box-shadow: 0 3px 8px rgba(230, 130, 200, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 14px;
            font-size: 20px;
            user-select: none;
        }

        .dpad-btn:active, .dpad-btn.active {
            background: #fbcfe8;
            transform: scale(0.92);
        }

        @keyframes pulse-light {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.06); }
        }
        .pulse-active {
            animation: pulse-light 1s infinite ease-in-out;
        }

        .cloud-bg {
            position: absolute;
            opacity: 0.25;
            pointer-events: none;
            animation: floatCloud linear infinite;
        }

        @keyframes floatCloud {
            from { transform: translateX(-200px); }
            to { transform: translateX(100vw); }
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col justify-between items-center p-1.5 select-none">

    <div class="cloud-bg text-5xl top-4" style="animation-duration: 35s;">☁️</div>
    <div class="cloud-bg text-6xl top-1/2" style="animation-duration: 45s; animation-delay: -10s;">☁️</div>

    <!-- Compact Landscape Header -->
    <header class="w-full max-w-5xl glass-panel rounded-2xl px-3 py-1.5 flex flex-col gap-1 z-10">
        <div class="flex justify-between items-center">
            <!-- Player 1 Stats -->
            <div class="flex items-center gap-2">
                <div id="hud-p1-avatar" class="w-8 h-8 rounded-xl bg-cyan-300 border-2 border-white flex items-center justify-center text-xl shadow-inner">🐰</div>
                <div>
                    <div id="hud-p1-name" class="font-fredoka text-cyan-600 text-xs leading-none">Blinky</div>
                    <div id="p1-score" class="font-fredoka text-sm text-cyan-500">33%</div>
                </div>
            </div>

            <!-- Timer Badge -->
            <div class="glass-panel px-3 py-0.5 rounded-xl border-2 border-amber-300 bg-amber-50/80 text-center">
                <div id="game-timer" class="font-fredoka text-xl text-amber-500 leading-none">120</div>
            </div>

            <!-- Opponent Stats Group -->
            <div class="flex items-center gap-2">
                <div id="p2-header-group" class="flex items-center gap-2 flex-row-reverse text-right">
                    <div id="hud-p2-avatar" class="w-8 h-8 rounded-xl bg-pink-300 border-2 border-white flex items-center justify-center text-xl shadow-inner">🐱</div>
                    <div>
                        <div id="hud-p2-name" class="font-fredoka text-pink-600 text-xs leading-none">Glimmer</div>
                        <div id="p2-score" class="font-fredoka text-sm text-pink-500">33%</div>
                    </div>
                </div>

                <!-- Boss Stats (Hidden unless 3-way mode) -->
                <div id="boss-header-group" class="hidden items-center gap-2 flex-row-reverse text-right border-l pl-2 border-purple-200">
                    <div id="hud-boss-avatar" class="w-8 h-8 rounded-xl bg-amber-300 border-2 border-white flex items-center justify-center text-xl shadow-inner">🐉</div>
                    <div>
                        <div id="hud-boss-name" class="font-fredoka text-amber-600 text-xs leading-none">Megaburn</div>
                        <div id="boss-score" class="font-fredoka text-sm text-amber-500">34%</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Live Paint Progress Bar -->
        <div class="w-full bg-slate-200/80 rounded-full h-2.5 p-0.5 flex items-center shadow-inner overflow-hidden border border-white">
            <div id="progress-p1" class="bg-gradient-to-r from-cyan-400 to-sky-400 h-full rounded-full transition-all duration-300" style="width: 33%;"></div>
            <div id="progress-p2" class="bg-gradient-to-r from-pink-400 to-rose-400 h-full rounded-full transition-all duration-300" style="width: 33%;"></div>
            <div id="progress-boss" class="bg-gradient-to-r from-amber-400 to-yellow-400 h-full rounded-full transition-all duration-300 hidden" style="width: 34%;"></div>
        </div>
    </header>

    <!-- Maximized Landscape Canvas Section -->
    <main class="relative flex-1 w-full flex items-center justify-center overflow-hidden my-0.5">
        <div class="relative w-full h-full flex items-center justify-center">
            <canvas id="gameCanvas" class="cursor-pointer max-w-full max-h-full object-contain"></canvas>

            <div id="powerup-badge" class="absolute top-1 bg-white/90 border-2 border-purple-400 rounded-full px-3 py-0.5 font-fredoka text-purple-600 shadow-lg text-xs hidden pulse-active">
                ✨ Speed Boost!
            </div>
        </div>
    </main>

    <!-- Landscape Footer Controls -->
    <footer class="w-full max-w-5xl flex items-center justify-between gap-2 z-10 px-2 mb-0.5">
        <div id="controls-container" class="grid grid-cols-3 gap-1 w-36 h-28 p-1 bg-white/40 rounded-2xl border-2 border-white/60 backdrop-blur-sm">
            <!-- Rendered dynamically -->
        </div>

        <div class="flex gap-2">
            <button id="btn-sound" class="btn-cute bg-purple-400 hover:bg-purple-500 text-white font-fredoka px-3 py-2 rounded-xl text-xs flex items-center gap-1 shadow-md">
                🔊 Audio
            </button>
            <button id="btn-menu" class="btn-cute bg-pink-400 hover:bg-pink-500 text-white font-fredoka px-3 py-2 rounded-xl text-xs flex items-center gap-1 shadow-md">
                🎨 Menu
            </button>
        </div>
    </footer>

    <!-- Modals Overlay -->
    <div id="modal-overlay" class="fixed inset-0 z-50 bg-purple-900/40 backdrop-blur-md flex items-center justify-center p-2">
        <!-- Start / Customization Menu Card -->
        <div id="start-card" class="glass-panel max-w-md w-full max-h-[92vh] overflow-y-auto rounded-3xl p-4 text-center border-4 border-white shadow-2xl space-y-3">
            <div class="text-4xl animate-bounce">🎨✨</div>
            <h1 class="font-fredoka text-2xl sm:text-3xl text-transparent bg-clip-text bg-gradient-to-r from-cyan-500 via-purple-500 to-pink-500">
                Glow Bunny Paint Party
            </h1>
            <p class="text-purple-800 text-xs font-semibold">
                Choose game modes, customize your skins, and jump into the arena!
            </p>

            <div class="grid grid-cols-2 gap-2 bg-white/70 p-2 rounded-2xl border border-pink-200 text-left">
                <div>
                    <label class="font-fredoka text-purple-700 text-[11px] block mb-0.5">Single Player:</label>
                    <select id="single-mode-select" class="w-full p-1.5 rounded-xl border-2 border-purple-300 font-fredoka text-[11px] text-purple-900 bg-white">
                        <option value="pvccom">Player vs COM</option>
                        <option value="pvccomboss">Player vs COM vs Boss</option>
                    </select>
                </div>
                <div>
                    <label class="font-fredoka text-purple-700 text-[11px] block mb-0.5">Multiplayer:</label>
                    <select id="multi-mode-select" class="w-full p-1.5 rounded-xl border-2 border-purple-300 font-fredoka text-[11px] text-purple-900 bg-white">
                        <option value="none">-- Select --</option>
                        <option value="pvp">Player vs Player</option>
                    </select>
                </div>
            </div>

            <div class="flex justify-center gap-1">
                <button id="tab-custom-p1" onclick="switchCustomTarget('p1')" class="btn-cute px-2.5 py-1 rounded-lg font-fredoka text-[11px] bg-cyan-500 text-white shadow">🐰 P1</button>
                <button id="tab-custom-p2" onclick="switchCustomTarget('p2')" class="btn-cute px-2.5 py-1 rounded-lg font-fredoka text-[11px] bg-white/70 text-purple-800 shadow">🐱 P2</button>
                <button id="tab-custom-boss" onclick="switchCustomTarget('boss')" class="btn-cute px-2.5 py-1 rounded-lg font-fredoka text-[11px] bg-white/70 text-purple-800 shadow">🐉 Boss</button>
            </div>

            <div class="flex justify-center gap-1.5">
                <button id="tab-animal" onclick="switchSkinCategory('animal')" class="btn-cute px-2.5 py-1 rounded-lg font-fredoka text-[11px] bg-purple-500 text-white shadow">🐾 Animals</button>
                <button id="tab-holiday" onclick="switchSkinCategory('holiday')" class="btn-cute px-2.5 py-1 rounded-lg font-fredoka text-[11px] bg-white/70 text-purple-800 shadow">🎃 Holidays</button>
                <button id="tab-fruit" onclick="switchSkinCategory('fruit')" class="btn-cute px-2.5 py-1 rounded-lg font-fredoka text-[11px] bg-white/70 text-purple-800 shadow">🍓 Fruits</button>
            </div>

            <div class="text-left">
                <label id="skin-label" class="font-fredoka text-purple-700 text-xs">Choose Skin:</label>
                <div id="character-selector" class="grid grid-cols-5 gap-1.5 max-h-24 overflow-y-auto p-1.5 bg-white/70 rounded-2xl border border-pink-200 mt-1"></div>
            </div>

            <div class="text-left">
                <label class="font-fredoka text-purple-700 text-xs">Choose Color:</label>
                <div id="color-selector" class="grid grid-cols-10 gap-1 max-h-16 overflow-y-auto p-1.5 bg-white/70 rounded-2xl border border-pink-200 mt-1"></div>
            </div>

            <button id="btn-start" class="btn-cute w-full py-3 bg-gradient-to-r from-cyan-400 to-purple-400 hover:from-cyan-500 hover:to-purple-500 text-white font-fredoka text-lg rounded-2xl shadow-lg border-2 border-white">
                Start Painting! 🌈
            </button>
        </div>

        <!-- Victory Result Card -->
        <div id="result-card" class="glass-panel max-w-sm w-full rounded-3xl p-5 text-center border-4 border-white shadow-2xl space-y-3 hidden">
            <div id="result-emoji" class="text-6xl animate-pulse">🏆</div>
            <h2 id="result-title" class="font-fredoka text-2xl text-cyan-600">Player 1 Wins!</h2>
            <p id="result-subtitle" class="text-purple-800 font-bold text-sm">You painted 68% of the board!</p>
            <button id="btn-play-again" class="btn-cute w-full py-3 bg-gradient-to-r from-cyan-400 to-purple-400 text-white font-fredoka text-lg rounded-2xl shadow-lg border-2 border-white">
                Play Again! 🌟
            </button>
        </div>
    </div>

    <script>
        class SoundFX {
            constructor() { this.ctx = null; this.muted = false; }
            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    if (AudioContext) this.ctx = new AudioContext();
                }
            }
            playTone(freq, type = 'sine', duration = 0.1, gainVal = 0.1) {
                if (this.muted || !this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    gain.gain.setValueAtTime(gainVal, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + duration);
                } catch(e) {}
            }
            pop() { this.playTone(400 + Math.random() * 200, 'sine', 0.08, 0.15); }
            powerup() {
                if (this.muted || !this.ctx) return;
                [440, 554, 659, 880].forEach((f, i) => {
                    setTimeout(() => this.playTone(f, 'triangle', 0.12, 0.2), i * 60);
                });
            }
            winJingle() {
                if (this.muted || !this.ctx) return;
                [523.25, 659.25, 783.99, 1046.50].forEach((f, i) => {
                    setTimeout(() => this.playTone(f, 'sine', 0.25, 0.25), i * 120);
                });
            }
        }

        const sfx = new SoundFX();
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const GRID_ROWS = 22;
        const GRID_COLS = 36;
        let cellSize = 20;

        let grid = []; 
        let wallGrid = []; 
        let powerups = [];
        let particles = [];
        let celebrationParticles = [];

        let isGameRunning = false;
        let gameTimeLeft = 120;
        let timerInterval = null;
        let currentGameMode = 'pvccom';
        let customTarget = 'p1';
        let currentCategory = 'animal';

        const SKIN_CATEGORIES = {
            animal: [
                { id: 0, name: "Bunny", icon: "🐰" }, { id: 1, name: "Kitty", icon: "🐱" },
                { id: 2, name: "Bear", icon: "🐻" }, { id: 3, name: "Fox", icon: "🦊" },
                { id: 4, name: "Puppy", icon: "🐶" }, { id: 5, name: "Panda", icon: "🐼" },
                { id: 6, name: "Koala", icon: "🐨" }, { id: 7, name: "Frog", icon: "🐸" },
                { id: 8, name: "Owl", icon: "🦉" }, { id: 9, name: "Penguin", icon: "🐧" }
            ],
            holiday: [
                { id: 20, name: "Pumpkin", icon: "🎃" }, { id: 21, name: "Santa", icon: "🎅" },
                { id: 22, name: "Snowman", icon: "⛄" }, { id: 23, name: "Tree", icon: "🎄" },
                { id: 24, name: "Ghost", icon: "👻" }, { id: 25, name: "Heart", icon: "💖" }
            ],
            fruit: [
                { id: 40, name: "Apple", icon: "🍎" }, { id: 41, name: "Banana", icon: "🍌" },
                { id: 42, name: "Strawberry", icon: "🍓" }, { id: 43, name: "Watermelon", icon: "🍉" }
            ]
        };

        const COLOR_SWATCHES = [
            { name: "Neon Cyan", hex: "#00E5FF" }, { name: "Bubblegum Pink", hex: "#FF4081" },
            { name: "Electric Lime", hex: "#76FF03" }, { name: "Sunshine Yellow", hex: "#FFEA00" },
            { name: "Radiant Purple", hex: "#E040FB" }, { name: "Aqua Mint", hex: "#1DE9B6" },
            { name: "Fiery Coral", hex: "#FF6E40" }, { name: "Luminous Lilac", hex: "#B388FF" },
            { name: "Emerald Glow", hex: "#00E676" }, { name: "Hot Magenta", hex: "#FF1744" }
        ];

        const player1 = {
            x: 2, y: 2, px: 0, py: 0, dx: 0, dy: 0, speed: 4.8,
            trailColor: 'rgba(0, 229, 255, 0.85)', glowColor: '#00E5FF',
            name: 'Blinky', powerup: null, powerupTimer: 0, danceTimer: 0, freezeTimer: 0,
            charType: SKIN_CATEGORIES.animal[0], colorSwatch: COLOR_SWATCHES[0]
        };

        const player2 = {
            x: GRID_COLS - 3, y: GRID_ROWS - 3, px: 0, py: 0, dx: 0, dy: 0, speed: 4.2,
            trailColor: 'rgba(255, 64, 129, 0.85)', glowColor: '#FF4081',
            name: 'Whiskers', powerup: null, powerupTimer: 0, danceTimer: 0, changeDirTimer: 0, freezeTimer: 0,
            charType: SKIN_CATEGORIES.animal[1], colorSwatch: COLOR_SWATCHES[1]
        };

        const boss = {
            x: Math.floor(GRID_COLS / 2), y: Math.floor(GRID_ROWS / 2), px: 0, py: 0, dx: 0, dy: 0, speed: 5.2,
            trailColor: 'rgba(234, 179, 8, 0.85)', glowColor: '#EAB308',
            name: 'Megaburn', powerup: null, powerupTimer: 0, danceTimer: 0, changeDirTimer: 0, freezeTimer: 0,
            charType: SKIN_CATEGORIES.holiday[0], colorSwatch: COLOR_SWATCHES[3]
        };

        let keys = { up: false, down: false, left: false, right: false };

        function buildControlsUI() {
            const container = document.getElementById('controls-container');
            container.innerHTML = `
                <div></div>
                <button id="btn-up" class="dpad-btn text-purple-600">▲</button>
                <div></div>
                <button id="btn-left" class="dpad-btn text-purple-600">◄</button>
                <div class="flex items-center justify-center text-lg">🌈</div>
                <button id="btn-right" class="dpad-btn text-purple-600">►</button>
                <div></div>
                <button id="btn-down" class="dpad-btn text-purple-600">▼</button>
                <div></div>
            `;
            ['up', 'down', 'left', 'right'].forEach((key, idx) => {
                const el = document.querySelectorAll('.dpad-btn')[idx];
                if (!el) return;
                const startPress = (e) => { e.preventDefault(); sfx.init(); sfx.pop(); keys[key] = true; el.classList.add('active'); };
                const endPress = (e) => { e.preventDefault(); keys[key] = false; el.classList.remove('active'); };
                el.addEventListener('mousedown', startPress);
                el.addEventListener('mouseup', endPress);
                el.addEventListener('touchstart', startPress);
                el.addEventListener('touchend', endPress);
            });
        }

        function switchCustomTarget(target) {
            customTarget = target;
            ['p1', 'p2', 'boss'].forEach(t => {
                const btn = document.getElementById(`tab-custom-${t}`);
                btn.className = `btn-cute px-2.5 py-1 rounded-lg font-fredoka text-[11px] ${t === target ? 'bg-cyan-500 text-white' : 'bg-white/70 text-purple-800'} shadow`;
            });
            populateMenus();
        }

        function switchSkinCategory(cat) {
            currentCategory = cat;
            ['animal', 'holiday', 'fruit'].forEach(c => {
                const btn = document.getElementById(`tab-${c}`);
                btn.className = `btn-cute px-2.5 py-1 rounded-lg font-fredoka text-[11px] ${c === cat ? 'bg-purple-500 text-white' : 'bg-white/70 text-purple-800'} shadow`;
            });
            populateMenus();
        }

        function populateMenus() {
            const activeChar = customTarget === 'p1' ? player1 : (customTarget === 'p2' ? player2 : boss);
            const charContainer = document.getElementById('character-selector');
            charContainer.innerHTML = '';
            SKIN_CATEGORIES[currentCategory].forEach(char => {
                const btn = document.createElement('button');
                btn.className = `p-1 rounded-xl flex flex-col items-center justify-center border-2 ${activeChar.charType.id === char.id ? 'border-cyan-500 bg-cyan-100 scale-105' : 'border-white bg-white/60'}`;
                btn.innerHTML = `<span class="text-xl">${char.icon}</span>`;
                btn.onclick = () => { activeChar.charType = char; populateMenus(); };
                charContainer.appendChild(btn);
            });

            const colorContainer = document.getElementById('color-selector');
            colorContainer.innerHTML = '';
            COLOR_SWATCHES.forEach(swatch => {
                const btn = document.createElement('button');
                btn.className = `w-5 h-5 rounded-full border-2 ${activeChar.colorSwatch.hex === swatch.hex ? 'border-purple-800 scale-125' : 'border-white'}`;
                btn.style.backgroundColor = swatch.hex;
                btn.onclick = () => {
                    activeChar.colorSwatch = swatch;
                    activeChar.trailColor = swatch.hex + 'CC';
                    activeChar.glowColor = swatch.hex;
                    populateMenus();
                };
                colorContainer.appendChild(btn);
            });
        }

        function resizeCanvas() {
            const container = canvas.parentElement;
            let width = container.clientWidth;
            let height = width * (GRID_ROWS / GRID_COLS);
            if (height > container.clientHeight) {
                height = container.clientHeight;
                width = height * (GRID_COLS / GRID_ROWS);
            }
            canvas.width = width;
            canvas.height = height;
            cellSize = width / GRID_COLS;
        }

        function initGrid() {
            grid = Array(GRID_ROWS).fill(0).map(() => Array(GRID_COLS).fill(0));
            wallGrid = Array(GRID_ROWS).fill(0).map(() => Array(GRID_COLS).fill(0));
            player1.x = 2; player1.y = 2;
            player2.x = GRID_COLS - 3; player2.y = GRID_ROWS - 3;
            boss.x = Math.floor(GRID_COLS / 2); boss.y = Math.floor(GRID_ROWS / 2);
        }

        function gameLoop() {
            if (isGameRunning) {
                player1.dx = 0; player1.dy = 0;
                if (keys.up) player1.dy = -1;
                if (keys.down) player1.dy = 1;
                if (keys.left) player1.dx = -1;
                if (keys.right) player1.dx = 1;

                if (player1.dx !== 0 || player1.dy !== 0) {
                    player1.px += player1.dx * player1.speed;
                    player1.py += player1.dy * player1.speed;
                }
                player1.x = player1.px / cellSize;
                player1.y = player1.py / cellSize;
            }

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let r = 0; r < GRID_ROWS; r++) {
                for (let c = 0; c < GRID_COLS; c++) {
                    ctx.fillStyle = (r + c) % 2 === 0 ? '#ffffff' : '#f8fafc';
                    ctx.fillRect(c * cellSize + 1, r * cellSize + 1, cellSize - 2, cellSize - 2);
                }
            }

            requestAnimationFrame(gameLoop);
        }

        function startGame() {
            sfx.init();
            initGrid();
            isGameRunning = true;
            resizeCanvas();
            document.getElementById('modal-overlay').classList.add('hidden');
            document.getElementById('start-card').classList.add('hidden');
        }

        window.onload = () => {
            populateMenus();
            resizeCanvas();
            buildControlsUI();
            document.getElementById('btn-start').onclick = startGame;
            document.getElementById('btn-play-again').onclick = startGame;
            document.getElementById('btn-menu').onclick = () => { isGameRunning = false; document.getElementById('modal-overlay').classList.remove('hidden'); document.getElementById('start-card').classList.remove('hidden'); };
            window.onresize = resizeCanvas;
            gameLoop();
        };
    </script>
</body>
</html>
